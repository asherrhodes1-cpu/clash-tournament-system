<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercifulAj</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 40px;
            background: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCARXhpZgAATU0AKgAAAAgABQESAAMAAAABAAEAAAEaAAUAAAABAAAASgEbAAUAAAABAAA...') center/contain no-repeat;
            opacity: 0.9;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fbbf24;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .work-in-progress {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 40px;
            color: #fcd34d;
            font-size: 0.95rem;
        }
        
        .cta-button {
            display: inline-block;
            background: #fbbf24;
            color: #111827;
            padding: 14px 40px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .cta-button:hover {
            background: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2);
        }
        
        .footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .logo {
                width: 120px;
                height: 120px;
            }
            
            .cta-button {
                padding: 12px 30px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Logo will load from your GitHub -->
        </div>
        
        <h1>MercifulAj</h1>
        
        <div class="work-in-progress">
            ⚙️ This site is currently under development
        </div>
        
        <p class="subtitle">
            A Clash of Clans Builder Base tournament management system with live bracket tracking, player rankings, and dispute resolution.
        </p>
        
        <a href="/tournaments" class="cta-button">
            Enter Tournaments →
        </a>
        
        <div class="footer">
            <p>Built for competitive Clash players</p>
        </div>
    </div>
</body>
</html>
