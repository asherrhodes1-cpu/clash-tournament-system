<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercifulAj</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .logo img {
            width: 200px;
            height: 200px;
            margin: 0 auto 50px;
            display: block;
            object-fit: contain;
        }
        
        .cta-button {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 16px 50px;
            border-radius: 2px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid #ffffff;
            cursor: pointer;
            letter-spacing: 1px;
        }
        
        .cta-button:hover {
            background: #000000;
            color: #ffffff;
            border-color: #ffffff;
        }
        
        @media (max-width: 600px) {
            .logo img {
                width: 150px;
                height: 150px;
            }
            
            .cta-button {
                padding: 14px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../logo.png" alt="ASHER Logo" width="200" height="151">
        </div>
        
        <a href="/tournaments" class="cta-button">
            ENTER TOURNAMENTS
